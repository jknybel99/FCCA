# Production Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  school-bell-system:
    # Use host network for better audio support in production
    network_mode: host
    
    # Restart policy for production
    restart: always
    
    # Resource limits (adjust based on your server)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Production environment variables
    environment:
      - TZ=America/Chicago
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=WARNING  # Less verbose logging
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Read-only root filesystem (except for writable volumes)
    # read_only: true
    # tmpfs:
    #   - /tmp
    #   - /var/tmp
